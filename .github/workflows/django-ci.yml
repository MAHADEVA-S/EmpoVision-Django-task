name: Django CI
on:
  push:
    branches: ["master", "feat/**"]
  pull_request:
    branches: ["master"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run regression tests
        run: python manage.py test
      - name: Apply database migrations
        run: python manage.py migrate --noinput
      - name: Start server and run HTTP smoke tests
        run: |
          set -e
          python manage.py runserver 127.0.0.1:8000 > /tmp/empovision-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health/ > /tmp/empovision-health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health/ | grep -q '"status": "ok"'
          curl --fail --silent http://127.0.0.1:8000/ | grep -q 'EmpoVision'
